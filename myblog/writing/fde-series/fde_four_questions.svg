<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="The four questions of forward deployed engineering: preconditions, the window, the joint call, the handover. Two judgements feed back from the handover: who the intended catcher is, which changes what you build during the window, and whether that team can carry it, which changes what the joint team hands back.">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 01 Preconditions -->
  <rect x="100" y="20" width="400" height="80" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="300" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">01 · Preconditions</text>
  <text x="300" y="76" text-anchor="middle" fill="#a0a0b8" font-size="12">Should the work be done this way at all?</text>

  <line x1="300" y1="100" x2="300" y2="140" stroke="#555" stroke-width="2"/>
  <polygon points="292,134 300,146 308,134" fill="#555"/>

  <!-- 02 The Window -->
  <rect x="100" y="146" width="400" height="80" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="300" y="178" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">02 · The Window</text>
  <text x="300" y="202" text-anchor="middle" fill="#a0a0b8" font-size="12">What we build, and in what order</text>

  <line x1="300" y1="226" x2="300" y2="266" stroke="#555" stroke-width="2"/>
  <polygon points="292,260 300,272 308,260" fill="#555"/>

  <!-- 03 The Joint Call -->
  <rect x="100" y="272" width="400" height="80" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="300" y="304" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">03 · The Joint Call</text>
  <text x="300" y="328" text-anchor="middle" fill="#a0a0b8" font-size="12">What we do together, and what they do alone</text>

  <line x1="300" y1="352" x2="300" y2="392" stroke="#555" stroke-width="2"/>
  <polygon points="292,386 300,398 308,386" fill="#555"/>

  <!-- 04 The Handover -->
  <rect x="100" y="398" width="400" height="80" rx="8" fill="#16213e" filter="url(#shadow)"/>
  <text x="300" y="430" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">04 · The Handover</text>
  <text x="300" y="454" text-anchor="middle" fill="#a0a0b8" font-size="12">Who keeps it alive once we've gone</text>

  <!-- Feedback: the catcher decision changes what you build -->
  <path d="M 100 438 H 67 Q 55 438 55 426 V 198 Q 55 186 67 186 H 86"
        fill="none" stroke="#8a8aa0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="86,180 98,186 86,192" fill="#8a8aa0"/>

  <!-- Feedback: can they carry it changes what you hand back -->
  <path d="M 55 312 H 86" fill="none" stroke="#8a8aa0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="86,306 98,312 86,318" fill="#8a8aa0"/>

  <!-- Two distinct judgements, not one -->
  <text x="30" y="246" text-anchor="middle" fill="#8a8aa0" font-size="12" font-style="italic" transform="rotate(-90 30 246)">who is the catcher?</text>
  <text x="30" y="382" text-anchor="middle" fill="#8a8aa0" font-size="12" font-style="italic" transform="rotate(-90 30 382)">can they carry it?</text>
</svg>
